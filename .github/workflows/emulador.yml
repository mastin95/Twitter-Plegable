name: Prueba en emulador

# Arranca un Android virtual, instala Pliegue y recorre el inicio de sesión de X. Las capturas, lo
# que hay en pantalla y el registro de la app se suben a la rama pruebas-emulador para revisarlos.
on:
  push:
    branches: ['prueba-**', login-pantalla]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: emulador-${{ github.ref }}
  cancel-in-progress: true

jobs:
  login:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: APK de depuración
        run: ./gradlew --no-daemon assembleDebug

      - name: Activar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Recorrer el login en un Android virtual
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash .github/scripts/probar-login.sh

      - name: Subir capturas a la rama pruebas-emulador
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          [ -d prueba-out ] || exit 0
          cd prueba-out
          git init -q
          git checkout -q -b pruebas-emulador
          git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "Prueba en emulador de ${GITHUB_SHA::7} (ejecución ${GITHUB_RUN_ID})"
          git push -q -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" pruebas-emulador
