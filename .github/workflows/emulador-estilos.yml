name: Prueba de estilos en emulador

# Arranca un Android virtual ancho, instala Pliegue y prueba con la WebView de verdad los estilos que
# la app pone encima de la web de X. Las capturas y medidas se suben a la rama pruebas-estilos.
on:
  push:
    branches: ['iconos-**', 'estilos-**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: emulador-estilos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  estilos:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: APK de depuración
        run: ./gradlew --no-daemon assembleDebug

      - name: Cliente de DevTools
        run: python3 -m pip install --quiet websocket-client

      - name: Activar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Probar los estilos en un Android virtual
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash .github/scripts/probar-estilos.sh

      - name: Subir capturas a la rama pruebas-estilos
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          [ -d estilos-out ] || exit 0
          cd estilos-out
          git init -q
          git checkout -q -b pruebas-estilos
          git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "Prueba de estilos de ${GITHUB_SHA::7} (ejecución ${GITHUB_RUN_ID})"
          git push -q -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" pruebas-estilos
